<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Local Type Kit – Cover</title>
<!-- Titelbild fuer die Figma-Community-Seite: python3 build.py, dann mit Headless Chrome in 1920x960 und 1920x1080 aufnehmen. -->
<style>
@font-face { font-family: "Instrument Serif"; src: url("../assets/fonts/InstrumentSerif-Regular.ttf") format("truetype"); }
@font-face { font-family: "Neue Heimat"; src: url("../assets/fonts/NeueHeimat.woff2") format("woff2"); font-weight: 300 700; }
@font-face { font-family: "Inter"; src: url("../assets/fonts/inter-regular.ttf") format("truetype"); font-weight: 400; }
@font-face { font-family: "Inter"; src: url("../assets/fonts/inter-medium.ttf") format("truetype"); font-weight: 500; }
@font-face { font-family: "Inter"; src: url("../assets/fonts/inter-semibold.ttf") format("truetype"); font-weight: 600; }
:root { --bg: #171614; --fg: #EDEAE4; --fg-2: #B6B1A8; --fg-3: #858077; --border: #33312D; --win: #1F1E1B; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
body { display: grid; grid-template-columns: 1fr 440px; align-items: center; gap: 120px; padding: 0 150px; font-family: "Neue Heimat", Inter, sans-serif; }
.text { position: relative; }
.aa { position: absolute; left: -20px; top: -270px; font: 400 430px/.8 "Instrument Serif", serif; color: color-mix(in srgb, var(--fg) 13%, var(--bg)); filter: blur(5px);
  -webkit-mask-image: linear-gradient(to bottom, #000 30%, transparent 85%); mask-image: linear-gradient(to bottom, #000 30%, transparent 85%); z-index: 0; }
.eyebrow { position: relative; display: inline-flex; align-items: center; gap: 10px; padding: 8px 18px; border: 1px solid var(--border); border-radius: 999px; font-size: 22px; color: var(--fg-2); margin-bottom: 34px; background: color-mix(in srgb, var(--bg) 60%, transparent); }
h1 { position: relative; margin: 0; font: 400 136px/.9 "Instrument Serif", serif; letter-spacing: -.01em; }
p { position: relative; margin: 36px 0 0; font-size: 28px; line-height: 1.45; color: var(--fg-2); max-width: 760px; }
.win { position: relative; width: 440px; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; background: var(--win); box-shadow: 0 30px 80px rgba(0,0,0,.45); transform: scale(1.3); transform-origin: center; }
.bar { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-bottom: 1px solid var(--border); font: 600 13px Inter, sans-serif; }
.bar img { width: 20px; height: 20px; border-radius: 5px; }
.bar .x { margin-left: auto; color: var(--fg-3); font-size: 18px; }
#plugin { display: block; width: 100%; height: 560px; border: 0; }
</style>
</head>
<body>
<div class="text">
  <div class="aa" aria-hidden="true">Aa</div>
  <div class="eyebrow">Figma plugin · free and open source</div>
  <h1>Your typeface<br>stays on your machine</h1>
  <p>Check, swap and turn the fonts in a Figma file into styles, with the fonts on your computer. Nothing is uploaded.</p>
</div>
<div class="win">
  <div class="bar"><img src="../assets/icon-128.png" alt=""><span>Local Type Kit</span><span class="x">×</span></div>
  <iframe id="plugin" data-src="../plugin/ui.html?lang=en"></iframe>
</div>
<script src="../plugin/demo.js"></script>
<script>
// Fuer das Bild: Brand Sans aufklappen und Inter als Ersatz eintragen, damit die Tabelle zeigt, was das Plugin tut.
document.getElementById("plugin").addEventListener("load", function () {
  var f = this;
  setTimeout(function () {
    var d = f.contentDocument, fam = d.querySelector(".fam"), i = fam && fam.querySelector("input");
    if (i) { i.value = "Inter"; i.dispatchEvent(new Event("change")); }
  }, 900);
});
</script>
</body>
</html>
